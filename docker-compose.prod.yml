version: "3.9"

services:
  app:
    build:
      target: production   # use production stage in Dockerfile
    env_file:
      - .env.prod
    deploy:
      replicas: 3          # run 3 instances
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      retries: 3
